<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E" />
<title>比較推奨販売 影響セルフチェック</title>
<meta name="description" content="9つの質問に答えると、2026年8月28日に金融庁が公表した比較推奨販売の改正が自分にどう関係するかがわかるセルフチェック。回答に応じた準備リストが出ます。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ground:#EFF2F6; --surface:#FFFFFF; --surface-2:#E7ECF3;
  --line:#D2D9E4; --line-soft:#E4E9F0;
  --ink:#111721; --ink-2:#38424F; --ink-3:#66717F;
  --accent:#22467A; --accent-2:#3B6CA6; --accent-soft:#E1EAF6;
  --high:#933925; --high-bg:#FAEBE6; --high-line:#E2BEB2;
  --mid:#87610F;  --mid-bg:#FBF3E1;  --mid-line:#E0CB99;
  --low:#2A6250;  --low-bg:#E5F1EC;  --low-line:#ADD1C3;
  --info:#57616F; --info-bg:#EBEFF4; --info-line:#CDD5DF;
  --shadow-s:0 1px 2px rgba(17,23,33,.05);
  --shadow-m:0 1px 3px rgba(17,23,33,.06),0 12px 30px -20px rgba(17,23,33,.32);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1116; --surface:#161B23; --surface-2:#1F2531;
    --line:#2A323F; --line-soft:#222933;
    --ink:#E7EBF2; --ink-2:#AFB9C7; --ink-3:#828E9F;
    --accent:#93B8E8; --accent-2:#6E9AD2; --accent-soft:#1A2536;
    --high:#E49B86; --high-bg:#2B1D18; --high-line:#4D332B;
    --mid:#DAB46B;  --mid-bg:#292317;  --mid-line:#493E26;
    --low:#80C4A9;  --low-bg:#15251E;  --low-line:#2B4337;
    --info:#94A1B1; --info-bg:#1B212A; --info-line:#2D3642;
    --shadow-s:0 1px 2px rgba(0,0,0,.5);
    --shadow-m:0 1px 3px rgba(0,0,0,.5),0 14px 34px -22px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1116; --surface:#161B23; --surface-2:#1F2531;
  --line:#2A323F; --line-soft:#222933;
  --ink:#E7EBF2; --ink-2:#AFB9C7; --ink-3:#828E9F;
  --accent:#93B8E8; --accent-2:#6E9AD2; --accent-soft:#1A2536;
  --high:#E49B86; --high-bg:#2B1D18; --high-line:#4D332B;
  --mid:#DAB46B;  --mid-bg:#292317;  --mid-line:#493E26;
  --low:#80C4A9;  --low-bg:#15251E;  --low-line:#2B4337;
  --info:#94A1B1; --info-bg:#1B212A; --info-line:#2D3642;
  --shadow-s:0 1px 2px rgba(0,0,0,.5);
  --shadow-m:0 1px 3px rgba(0,0,0,.5),0 14px 34px -22px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.85;font-feature-settings:"palt" 1;overflow-wrap:anywhere;
}
h1,h2,h3,h4{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;text-wrap:balance;margin:0;line-height:1.45}
p{margin:0}
ul,ol{margin:0;padding-left:1.4em}
li{margin:.32em 0}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.bar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .fill{height:3px;background:var(--accent-2);width:0;transition:width .3s ease}
.bar-in{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.bar b{font-family:"Zen Kaku Gothic New",sans-serif;font-size:15px;font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .cnt{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.ghost{
  background:transparent;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;
  padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  font-family:"Zen Kaku Gothic New",sans-serif;
}
.ghost:hover{border-color:var(--accent-2);color:var(--accent)}

.wrap{max-width:780px;margin:0 auto;padding:0 20px 90px}
.wrap.wide{max-width:1040px}

/* ---------- intro ---------- */
.intro{padding:58px 0 0}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.13em;font-weight:700;
  color:var(--accent);background:var(--accent-soft);padding:6px 13px;border-radius:999px;
}
.intro h1{font-size:clamp(29px,5.2vw,45px);font-weight:900;letter-spacing:-.015em;margin:22px 0 0;line-height:1.25}
.intro .lead{margin-top:18px;color:var(--ink-2);font-size:16.5px;max-width:32em}
.qlist{
  margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 26px;box-shadow:var(--shadow-s);
}
.qlist h2{font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.qlist ol{margin-top:12px;padding-left:1.3em;font-size:14.5px;color:var(--ink-2);columns:2;column-gap:34px}
@media (max-width:620px){.qlist ol{columns:1}}
.qlist li{break-inside:avoid}
.cta{
  margin-top:26px;display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--surface);
  border:0;border-radius:999px;padding:15px 30px;font-size:16px;font-weight:700;cursor:pointer;
  font-family:"Zen Kaku Gothic New",sans-serif;box-shadow:var(--shadow-m);
}
:root[data-theme="dark"] .cta{color:#0D1116}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cta{color:#0D1116}}
.cta:hover{background:var(--accent-2)}
.caveat{margin-top:30px;font-size:12.5px;color:var(--ink-3);line-height:1.85;max-width:44em}

/* ---------- question ---------- */
.qwrap{padding:44px 0 0}
.qnum{font-family:"Zen Kaku Gothic New",sans-serif;font-size:11.5px;letter-spacing:.14em;font-weight:700;color:var(--accent)}
.qwrap h2{font-size:clamp(21px,3.6vw,28px);font-weight:900;margin-top:8px;letter-spacing:-.01em;line-height:1.4}
.qhelp{margin-top:12px;color:var(--ink-3);font-size:13.5px;line-height:1.8;max-width:38em}
.opts{display:grid;gap:10px;margin-top:26px}
.opt{
  display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 20px;cursor:pointer;transition:border-color .14s,transform .14s,box-shadow .14s;color:inherit;
}
.opt:hover{border-color:var(--accent-2);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .mk{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:3px;
  display:grid;place-items:center;font-size:12px;color:transparent;
}
.opt.multi .mk{border-radius:6px}
.opt[aria-pressed="true"] .mk{border-color:var(--accent);background:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .opt[aria-pressed="true"] .mk{color:#0D1116}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt[aria-pressed="true"] .mk{color:#0D1116}}
.opt .tx{min-width:0}
.opt .tx b{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:16px;font-weight:700;line-height:1.55}
.opt .tx span{display:block;font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.7}
.qnav{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
.qnav .next{
  background:var(--accent);color:var(--surface);border:0;border-radius:999px;padding:13px 28px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:"Zen Kaku Gothic New",sans-serif;
}
:root[data-theme="dark"] .qnav .next{color:#0D1116}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qnav .next{color:#0D1116}}
.qnav .next[disabled]{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}

/* answered-so-far strip */
.sofar{margin-top:36px;padding-top:18px;border-top:1px dashed var(--line)}
.sofar h3{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:700;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px;
  font-size:12.5px;color:var(--ink-2);cursor:pointer;line-height:1.6;
}
.chips button:hover{border-color:var(--accent-2);color:var(--accent)}
.chips button i{font-style:normal;color:var(--ink-3);margin-right:6px}

/* ---------- result ---------- */
.res{padding:40px 0 0}
.verdict{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-m);padding:30px 34px;
}
.verdict .lv{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.lvbadge{
  display:inline-flex;align-items:center;gap:8px;font-family:"Zen Kaku Gothic New",sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.04em;padding:7px 16px;border-radius:999px;
}
.lvbadge.high{background:var(--high-bg);color:var(--high);border:1px solid var(--high-line)}
.lvbadge.mid{background:var(--mid-bg);color:var(--mid);border:1px solid var(--mid-line)}
.lvbadge.low{background:var(--low-bg);color:var(--low);border:1px solid var(--low-line)}
.lvbadge.info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-line)}
.verdict h2{font-size:clamp(21px,3.4vw,27px);font-weight:900;margin-top:16px;line-height:1.45;letter-spacing:-.01em}
.verdict .why{margin-top:14px;color:var(--ink-2);font-size:15px;line-height:1.9;max-width:52em}
.verdict .why b{color:var(--ink)}
.tally{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.tally span{
  font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:8px;font-variant-numeric:tabular-nums;
  font-family:"Zen Kaku Gothic New",sans-serif;
}
.tally .t-high{background:var(--high-bg);color:var(--high)}
.tally .t-mid{background:var(--mid-bg);color:var(--mid)}
.tally .t-low{background:var(--low-bg);color:var(--low)}
.tally .t-info{background:var(--info-bg);color:var(--info)}

.rsec{margin-top:46px}
.rsec > h2{font-size:19px;font-weight:900;display:flex;align-items:center;gap:11px;letter-spacing:-.01em}
.rsec > h2::before{content:"";width:18px;height:2px;background:var(--accent);display:block;flex:0 0 auto}
.rsec > p.note{color:var(--ink-3);font-size:13.5px;margin-top:8px;max-width:56em;line-height:1.8}

.cards{display:grid;gap:12px;margin-top:20px}
.rc{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--info);
  border-radius:0 var(--r) var(--r) 0;padding:20px 24px;
}
.rc.high{border-left-color:var(--high)}
.rc.mid{border-left-color:var(--mid)}
.rc.low{border-left-color:var(--low)}
.rc .rh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.tag{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:5px;white-space:nowrap;
  font-family:"Zen Kaku Gothic New",sans-serif;
}
.tag.high{background:var(--high-bg);color:var(--high)}
.tag.mid{background:var(--mid-bg);color:var(--mid)}
.tag.low{background:var(--low-bg);color:var(--low)}
.tag.info{background:var(--info-bg);color:var(--info)}
.rc .rh b{font-family:"Zen Kaku Gothic New",sans-serif;font-size:17px;font-weight:700;line-height:1.5;flex:1;min-width:60%}
.rc .lead{margin-top:11px;font-size:15px;line-height:1.9;color:var(--ink)}
.rc .todo{margin-top:14px;background:var(--surface-2);border-radius:9px;padding:14px 18px}
.rc .todo > b{
  display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:10.5px;letter-spacing:.13em;
  color:var(--ink-3);margin-bottom:6px;
}
.rc .todo li b,.rc .lead b{font-weight:700;color:var(--ink)}
.rc .todo ul{padding-left:1.25em;font-size:14.5px;line-height:1.8}
.rc .cite{
  margin-top:13px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;line-height:1.75;
}
.rc .cite b{font-family:"Zen Kaku Gothic New",sans-serif;letter-spacing:.1em;font-size:10.5px;margin-right:8px;color:var(--ink-3)}

/* checklist */
.check{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px;margin-top:20px}
.check label{
  display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-radius:9px;cursor:pointer;
  transition:background .12s;
}
.check label:hover{background:var(--surface-2)}
.check label + label{border-top:1px solid var(--line-soft)}
.check input{
  appearance:none;flex:0 0 auto;width:21px;height:21px;border:2px solid var(--line);border-radius:6px;
  margin:3px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--surface);
}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"✓";color:var(--surface);font-size:13px;font-weight:700;line-height:1}
:root[data-theme="dark"] .check input:checked::after{color:#0D1116}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .check input:checked::after{color:#0D1116}}
.check .ct{min-width:0}
.check .ct b{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:15.5px;font-weight:700;line-height:1.55}
.check .ct span{display:block;font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.75}
.check input:checked ~ .ct b{text-decoration:line-through;color:var(--ink-3)}

/* answers recap */
.recap{display:grid;gap:2px;margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.recap .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:13px 20px;align-items:center}
.recap .row + .row{border-top:1px solid var(--line-soft)}
.recap .q{font-size:13.5px;color:var(--ink-3);line-height:1.6}
.recap .a{font-size:14px;font-weight:700;text-align:right;font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.6}
.recap .row button{
  background:transparent;border:0;color:var(--accent);font-size:12.5px;cursor:pointer;padding:0;
  text-decoration:underline;text-underline-offset:3px;
}
@media (max-width:560px){
  .recap .row{grid-template-columns:minmax(0,1fr)}
  .recap .a{text-align:left}
}

.foot{margin-top:44px;padding:24px 26px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-size:13px;color:var(--ink-2);line-height:1.95}
.foot b{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);display:block;margin-bottom:7px;font-size:13.5px}
.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px}

@media print{
  :root{--ground:#fff;--surface:#fff;--surface-2:#f4f5f7;--ink:#000;--ink-2:#222;--ink-3:#555;
        --line:#bbb;--line-soft:#ddd;--shadow-s:none;--shadow-m:none}
  body{background:#fff;font-size:10.5pt;line-height:1.7}
  .bar,.actions,.recap .row button,.ghost{display:none!important}
  .wrap.wide{max-width:none;padding:0}
  .rc,.verdict,.check label,.foot{break-inside:avoid;page-break-inside:avoid;box-shadow:none}
  .rsec{margin-top:26px}
  a{color:inherit}
}
</style>

</head>
<body>
<header class="bar">
  <div class="fill" id="fill"></div>
  <div class="bar-in">
    <b>比較推奨販売 影響セルフチェック</b>
    <span class="cnt" id="cnt"></span>
    <button class="ghost" id="reset" hidden>最初から</button>
  </div>
</header>

<main>
<div class="wrap" id="stage"></div>
</main>

<script>
(function(){
"use strict";

/* ============================================================
   質問
   ============================================================ */
var QUESTIONS = [
 {id:'role', q:'あなたの立場を教えてください', type:'single',
  help:'今回の改正は、乗合代理店（二以上の所属保険会社等を有する保険募集人）を主な名宛人としています。立場によって見る資料が変わります。',
  opts:[
   {v:'corp',  t:'保険代理店（法人）',   s:'事業報告書は別紙様式第25号の2'},
   {v:'indiv', t:'保険代理店（個人）',   s:'事業報告書は別紙様式第25号の3'},
   {v:'staff', t:'保険会社の役員・使用人', s:'営業職員など'},
   {v:'fsi',   t:'金融サービス仲介業者（保険媒介業務）', s:'見る監督指針が変わります'}
  ]},
 {id:'count', q:'委託を受けている保険会社は何社ですか', type:'single',
  help:'生命保険会社・損害保険会社・少額短期保険業者を<b>合わせた</b>社数でお答えください。共済事業者は数えません（所属保険会社等に含まれないため）。',
  opts:[
   {v:'one',   t:'1社だけ', s:'生保・損保・少短を合わせて1社'},
   {v:'multi', t:'2社以上', s:'生保1社＋損保1社もこちらです'}
  ]},
 {id:'fields', q:'取り扱っている分野は', type:'multi',
  help:'あてはまるものをすべて選んでください。',
  opts:[
   {v:'life',   t:'生命保険'},
   {v:'nonlife',t:'損害保険'},
   {v:'small',  t:'少額短期保険'},
   {v:'jibai',  t:'自賠責保険'},
   {v:'kyosai', t:'共済'}
  ]},
 {id:'method', q:'いま、商品はどうやって決めていますか', type:'single',
  help:'いちばん近いものを選んでください。事業報告書の「比較・推奨販売の方法」欄でどれに○をつけているかが手がかりになります。',
  opts:[
   {v:'ro',     t:'顧客の意向を聞いてから、それに沿って候補を絞って提案している', s:'事業報告書の「1」に近い運用'},
   {v:'ha',     t:'商品特性や保険料水準といった客観的な基準によらずに絞り込んで提案している', s:'事業報告書の「2」に近い運用'},
   {v:'branch', t:'店舗・拠点・担当ごとに、推奨する保険会社をあらかじめ決めている', s:'テリトリー制など'},
   {v:'ionly',  t:'複数を並べて説明するだけで、特定の1本は勧めていない', s:'比較説明のみ'},
   {v:'unknown',t:'決めていない／よくわからない'}
  ]},
 {id:'joint', q:'共同募集を行っていますか', type:'single',
  help:'他の保険代理店と共同で募集を行う形態です。',
  opts:[
   {v:'none',   t:'行っていない'},
   {v:'kanji',  t:'行っている（自社が幹事）'},
   {v:'hikanji',t:'行っている（自社が非幹事）'},
   {v:'jimu',   t:'行っている（自社は事務のみ担当）'}
  ]},
 {id:'omakase', q:'「お任せします」と言われる場面はどのくらいありますか', type:'single',
  help:'「あなたが良いと思う商品で」「おすすめを教えて」「あなたならどこが良い？」なども含みます。',
  opts:[
   {v:'often',    t:'よくある', s:'募集の多くがこの入り方'},
   {v:'sometimes',t:'たまにある'},

/* ============================================================
   判定に使う派生値
   ============================================================ */
function derive(a){
  var agency = a.role==='corp'||a.role==='indiv';
  var d={};
  d.agency=agency;
  d.fsi=a.role==='fsi';
  d.staff=a.role==='staff';
  d.multi=(agency&&a.count==='multi')||d.fsi;      // 乗合代理店 相当
  d.solo=agency&&a.count==='one';
  d.subject=d.multi;                                 // 今回の改正の直接の対象か
  d.recommends=['ro','ha','branch','unknown'].indexOf(a.method)>=0;
  d.proposes=['ro','ha','branch'].indexOf(a.method)>=0;
  d.f=a.fields||[];
  d.has=function(x){return d.f.indexOf(x)>=0;};
  // 生命保険業と損害保険業は同一の保険会社が引き受けないため、両方を扱うなら引受会社は二以上になる
  d.mismatch = d.solo && d.has('life') && d.has('nonlife');
  if(d.mismatch){ d.solo=false; d.multi=true; d.subject=true; }
  return d;
}

function verdict(a,d){
  if(d.mismatch) return {lv:'high', label:'回答の確認が必要です',
    h:'「1社だけ」ではなく、乗合代理店に該当する可能性が高いです',
    why:'生命保険と損害保険の両方を取り扱っているとお答えいただきました。生命保険会社と損害保険会社は別の会社なので、委託先は<b>合計2社以上</b>になります。金融庁も「生命保険会社1社及び損害保険会社1社など、生命保険・損害保険の別を問わず二以上の所属保険会社等を有する保険募集人は、乗合代理店に該当します」と回答しています。以下は<b>乗合代理店に該当する前提</b>で表示しています。社数の認識が違う場合は、下の「回答の確認」から選び直してください。'};
  if(d.staff) return {lv:'info', label:'直接の名宛人ではありません',
    h:'今回の改正が直接の対象とするのは、乗合代理店です',
    why:'規則227条の2第3項第4号は「二以上の所属保険会社等を有する保険募集人」についての規定です。保険会社の役員・使用人については、会社が適切な研修・指導などの体制を整備している場合には、その指導に従い研修に参加することで基本的に足りるものと考えられる、とされています。'};
  if(d.solo) return {lv:'info', label:'直接の対象ではありません',
    h:'委託が1社であれば、今回の改正の直接の対象ではありません',
    why:'ただし<b>生保1社と損保1社を扱っているなら合計2社</b>で、乗合代理店に該当します。少額短期保険業者との委託も社数に数えます。下の確認事項をご覧ください。'};
  if(a.method==='ha'||a.method==='branch') return {lv:'high', label:'影響 大',
    h:'いまのやり方は、そのままでは続けられません',
    why:'客観的な基準によらずに絞り込む型（規則227条の2第3項第4号ハ）が<b>削除されます</b>。提案は「意向を聞く → 意向に沿って選ぶ → 概要と理由を説明する」の一本道になり、拠点ごとに推奨会社を決めておく運用も、顧客の意向によらない選別として否定されました。募集トーク・帳票・社内規則・事業報告書が同時に動きます。'};
  if(a.method==='unknown') return {lv:'high', label:'影響 大の可能性',
    h:'まず、いまのやり方を確かめてください',
    why:'現状がわからないままだと影響を測れません。事業報告書の「比較・推奨販売の方法」欄でどれに○をつけているかを確認してください。「2 客観的な基準や理由等に基づくことなく絞り込んで提示している」なら、それが廃止される「ハ」に対応する運用です。'};
  if(a.method==='ionly') return {lv:'low', label:'影響 限定的',
    h:'比較説明だけなら、影響は限定的です',
    why:'比較説明（イ）のルールは内容が明文化されただけで、大きく変わりません。ただし<b>一つでも特定の契約を提示・推奨するなら</b>、そこからは推奨販売（ロ）の対応が必要になります。実務でそういう場面がないか、確認してください。'};
  return {lv:'mid', label:'影響 中',
    h:'大枠は合っています。足りないのは、伝え方と残し方です',
    why:'意向を聞いてから選ぶ、という順序はすでに改正後の形です。新しく加わるのは、<b>推奨しなかった契約もある旨とその説明の申し出</b>、<b>理由の具体性の水準</b>、<b>後から検証できる記録</b>の3つです。'};
}

var SEVRANK={high:0,mid:1,low:2,info:3};
var SEVLABEL={high:'重要',mid:'要対応',low:'確認',info:'参考'};

function pickTopics(a,d){
  var out=[];
  for(var i=0;i<TOPICS.length;i++){
    var t=TOPICS[i];
    if(!t.when(a,d)) continue;
    var sev=t.sevFn?t.sevFn(a):t.sev;
    out.push({t:t,sev:sev,i:i});
  }
  out.sort(function(x,y){
    var r=SEVRANK[x.sev]-SEVRANK[y.sev];
    return r!==0?r:x.i-y.i;
  });
  return out;
}

var A={}, step=-1, DONE=false;
var KEY='hs-check-v1', CKEY='hs-check-tasks-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({a:A,step:step,done:DONE}));}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);A=o.a||{};step=typeof o.step==='number'?o.step:-1;DONE=!!o.done;}}catch(e){}}
function ticks(){try{return JSON.parse(localStorage.getItem(CKEY)||'{}');}catch(e){return {};}}
function tick(id,v){try{var o=ticks();o[id]=v;localStorage.setItem(CKEY,JSON.stringify(o));}catch(e){}}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function labelOf(q,v){
  if(q.type==='multi'){
    if(!v||!v.length) return '—';
    return v.map(function(x){
      for(var i=0;i<q.opts.length;i++) if(q.opts[i].v===x) return q.opts[i].t;
      return x;
    }).join('・');
  }
  for(var i=0;i<q.opts.length;i++) if(q.opts[i].v===v) return q.opts[i].t;
  return '—';
}
function answered(){var n=0;for(var i=0;i<QUESTIONS.length;i++){var q=QUESTIONS[i];var v=A[q.id];if(q.type==='multi'?(v&&v.length):v) n++;}return n;}

var stage=document.getElementById('stage'),
    fill=document.getElementById('fill'),
    cnt=document.getElementById('cnt'),
    resetBtn=document.getElementById('reset');

function chrome(){
  var total=QUESTIONS.length;
  if(DONE){fill.style.width='100%';cnt.textContent='結果';}
  else if(step<0){fill.style.width='0%';cnt.textContent=total+'問';}
  else{fill.style.width=Math.round(step/total*100)+'%';cnt.textContent=(step+1)+' / '+total;}
  resetBtn.hidden=(step<0&&!DONE);
  stage.className='wrap'+(DONE?' wide':'');
}

function renderQuestion(){
  var q=QUESTIONS[step], cur=A[q.id];
  var h='<section class="qwrap">'+
    '<div class="qnum">質問 '+(step+1)+' / '+QUESTIONS.length+'</div>'+
    '<h2>'+q.q+'</h2>'+
    (q.help?'<p class="qhelp">'+q.help+'</p>':'')+
    '<div class="opts" role="group">';
  for(var i=0;i<q.opts.length;i++){
    var o=q.opts[i];
    var on = q.type==='multi' ? (cur&&cur.indexOf(o.v)>=0) : cur===o.v;
    h+='<button type="button" class="opt'+(q.type==='multi'?' multi':'')+'" data-v="'+o.v+'" aria-pressed="'+(on?'true':'false')+'">'+
       '<span class="mk" aria-hidden="true">✓</span>'+
       '<span class="tx"><b>'+o.t+'</b>'+(o.s?'<span>'+o.s+'</span>':'')+'</span></button>';
  }
  h+='</div><div class="qnav">';
  if(step>0) h+='<button type="button" class="ghost" id="back">← 戻る</button>';
  if(q.type==='multi') h+='<button type="button" class="next" id="next"'+((cur&&cur.length)?'':' disabled')+'>次へ →</button>';
  h+='</div>';

  if(step>0){
    h+='<div class="sofar"><h3>ここまでの回答</h3><div class="chips">';
    for(var j=0;j<step;j++){
      var qq=QUESTIONS[j];
      h+='<button type="button" data-go="'+j+'"><i>'+(j+1)+'</i>'+esc(labelOf(qq,A[qq.id]))+'</button>';
    }
    h+='</div></div>';
  }
  h+='</section>';
  stage.innerHTML=h;

  var opts=stage.querySelectorAll('.opt');
  for(var k=0;k<opts.length;k++){
    opts[k].addEventListener('click',function(e){
      var v=e.currentTarget.getAttribute('data-v');
      if(q.type==='multi'){
        var arr=(A[q.id]||[]).slice();
        var ix=arr.indexOf(v);
        if(ix>=0) arr.splice(ix,1); else arr.push(v);
        A[q.id]=arr; save(); renderQuestion(); chrome();
      }else{
        A[q.id]=v; save();
        if(step<QUESTIONS.length-1){step++;} else {DONE=true;}
        save(); render();
      }
    });
  }
  var b=document.getElementById('back');
  if(b) b.addEventListener('click',function(){step--;save();render();});
  var n=document.getElementById('next');
  if(n) n.addEventListener('click',function(){
    if(step<QUESTIONS.length-1){step++;} else {DONE=true;}
    save(); render();
  });
  var gos=stage.querySelectorAll('[data-go]');
  for(var m=0;m<gos.length;m++){
    gos[m].addEventListener('click',function(e){
      step=parseInt(e.currentTarget.getAttribute('data-go'),10);save();render();
    });
  }
}

    var lead=t.leadFn?t.leadFn(A):t.lead;
    h+='<div class="rc '+sev+'">'+
       '<div class="rh"><span class="tag '+sev+'">'+SEVLABEL[sev]+'</span><b>'+t.title+'</b></div>'+
       '<p class="lead">'+lead+'</p>';
    var todo=t.todoFn?t.todoFn(A,d):t.todo;
    if(todo&&todo.length){
      h+='<div class="todo"><b>ポイント</b><ul>';
      for(var k=0;k<todo.length;k++) h+='<li>'+todo[k]+'</li>';
      h+='</ul></div>';
    }
    h+='<p class="cite"><b>出典</b>'+t.cite+'</p></div>';
  }
  h+='</div></div>';

  /* tasks */
  var tasks=[];
  for(var m=0;m<TASKS.length;m++) if(TASKS[m].when(A,d)) tasks.push(TASKS[m]);
  if(tasks.length){
    var tk=ticks();
    h+='<div class="rsec"><h2>あなたの準備リスト</h2>'+
       '<p class="note">上の内容を、代理店として手を動かす項目に並べ直したものです。チェックはこのブラウザに保存されます。印刷して持ち回れます。</p>'+
       '<div class="check">';
    for(var n=0;n<tasks.length;n++){
      var x=tasks[n];
      h+='<label><input type="checkbox" data-t="'+x.id+'"'+(tk[x.id]?' checked':'')+' />'+
         '<span class="ct"><b>'+x.t+'</b><span>'+x.s+'</span></span></label>';
    }
    h+='</div></div>';
  }

  /* recap */
  h+='<div class="rsec"><h2>回答の確認</h2>'+
     '<p class="note">選び直すと、結果もその場で変わります。</p><div class="recap">';
  for(var p=0;p<QUESTIONS.length;p++){
    var q=QUESTIONS[p];
    h+='<div class="row"><span class="q">'+q.q+'</span>'+
       '<span class="a">'+esc(labelOf(q,A[q.id]))+' <button type="button" data-edit="'+p+'">変更</button></span></div>';
  }
  h+='</div></div>';

  h+='<div class="actions">'+
     '<button class="ghost" id="print">この結果を印刷する</button>'+
     '<button class="ghost" id="again">最初からやり直す</button>'+
     '</div>';

  h+='<div class="foot"><b>この結果について</b>'+
     '金融庁が2026年8月28日に公表した資料にもとづく参考情報です。金融庁の公式見解ではなく、個別の事案について法的な結論を示すものでもありません。判定の分岐と準備リストは、公表資料を読み解いて編集部が組み立てたもので、原文にこの形の整理はありません。<br />'+
     '「二以上の比較可能な同種の保険契約」が存在するかどうかは、顧客の具体的な意向、対象となるリスク、保険給付の内容、保険契約の特性・類型等を踏まえて<b>個別具体的かつ実質的に判断される</b>とされています。このチェックは、その判断を代替するものではありません。<br />'+
     '実務上の判断は、必ず原文および所属先の社内規則を確認し、必要に応じて専門家にご相談ください。<br /><br />'+
     '<b>出典</b>'+
     '<a href="'+FSA+'01.pdf" target="_blank" rel="noopener noreferrer">資料01 コメントの概要及びコメントに対する金融庁の考え方</a>（全450ページ・759件）<br />'+
     '<a href="'+FSA+'02.pdf" target="_blank" rel="noopener noreferrer">資料02 保険業法施行規則及び金融サービス仲介業者等に関する内閣府令の一部を改正する内閣府令 新旧対照表</a><br />'+
     '<a href="'+FSA+'03.pdf" target="_blank" rel="noopener noreferrer">資料03 保険会社向けの総合的な監督指針（新旧対照表）</a><br />'+
     '<a href="'+FSA+'04.pdf" target="_blank" rel="noopener noreferrer">資料04 金融サービス仲介業者向けの総合的な監督指針 新旧対照表</a>'+
     '</div>';

  h+='</section>';
  stage.innerHTML=h;

  var cd=document.getElementById('cd');
  if(cd){var days=Math.ceil((new Date(2028,2,1)-new Date())/86400000);if(days>0)cd.textContent='（あと '+days.toLocaleString('ja-JP')+' 日）';}

  var boxes=stage.querySelectorAll('[data-t]');
  for(var b1=0;b1<boxes.length;b1++){
    boxes[b1].addEventListener('change',function(e){tick(e.currentTarget.getAttribute('data-t'),e.currentTarget.checked);});
  }
  var eds=stage.querySelectorAll('[data-edit]');
  for(var e1=0;e1<eds.length;e1++){
    eds[e1].addEventListener('click',function(e){
      step=parseInt(e.currentTarget.getAttribute('data-edit'),10);DONE=false;save();render();
      window.scrollTo(0,0);
    });
  }
  document.getElementById('print').addEventListener('click',function(){window.print();});
  document.getElementById('again').addEventListener('click',doReset);
}

function doReset(){
  A={};step=-1;DONE=false;save();render();window.scrollTo(0,0);
}

function render(){
  chrome();
  if(DONE) renderResult();
  else if(step<0) renderIntro();
  else renderQuestion();
  if(!DONE&&step>=0) window.scrollTo(0,0);
}

resetBtn.addEventListener('click',doReset);
load();
if(step>=QUESTIONS.length){step=QUESTIONS.length-1;}
render();
})();
</script>

</body>
</html>
