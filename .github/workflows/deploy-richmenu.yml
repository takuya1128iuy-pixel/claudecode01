name: リッチメニューをLINEに反映

# 実行するには line-richmenu/.deploy-request に次のどれかを書いて push する。
# ファイルが変わったときだけ動くので、ふだんの変更では起動しない。
#   inspect              いま登録されている内容を見るだけ
#   deploy               画像を作ってリッチメニューを反映する
#   clear                登録済みのリッチメニューとエイリアスを全部消す
#   link <userId>        そのユーザーにメニューAをリンクする（タブ切替の確認用）
#   link <userId> <key>  メニューを指定してリンクする（key は main / procedures）
#
# 事前に一度だけ:
#   Settings → Secrets and variables → Actions → New repository secret
#   Name: LINE_CHANNEL_ACCESS_TOKEN
#   Value: LINE Developers で発行した「チャネルアクセストークン（長期）」
#
# （workflow_dispatch のボタンは、このファイルがデフォルトブランチにある場合だけ出る）
on:
  push:
    paths:
      - 'line-richmenu/.deploy-request'
  workflow_dispatch:
    inputs:
      mode:
        description: 何をするか
        required: true
        default: inspect
        type: choice
        options:
          - inspect  # いま登録されている内容を見るだけ
          - deploy   # 画像を作ってリッチメニューを反映する
          - clear    # 登録済みのリッチメニューとエイリアスを全部消す

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: トークンが設定されているか確認する
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "::error::LINE_CHANNEL_ACCESS_TOKEN が未設定です。Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi

      - name: 何をするか決める
        id: mode
        run: |
          line="${{ inputs.mode }}"
          if [ -z "$line" ]; then line=$(head -n1 line-richmenu/.deploy-request); fi
          m=$(echo "$line" | awk '{print $1}')
          args=$(echo "$line" | cut -s -d' ' -f2-)
          case "$m" in
            deploy|inspect|clear) ;;
            link)
              case "$args" in
                U*) ;;
                *) echo "::error::link にはユーザーID（Uで始まる）が要ります: link U0123..."; exit 1 ;;
              esac
              ;;
            *) echo "::error::不明なモード: $m（inspect / deploy / clear / link のどれかにしてください）"; exit 1 ;;
          esac
          echo "モード: $m"
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: 依存を入れる
        working-directory: line-richmenu
        run: npm ci

      # 画像の撮影にブラウザが要る。ランナーに Chrome があればそれを使い、
      # 無いときだけ playwright で chromium を落とす。
      - name: ブラウザを用意する
        if: steps.mode.outputs.mode == 'deploy'
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
            echo "ランナーの Chrome を使います"
          else
            npx --yes playwright@1.63.0 install --with-deps chromium
          fi

      # ランナーには日本語フォントが入っていない。無いまま撮ると文字が□になる。
      - name: 日本語フォントを入れる
        if: steps.mode.outputs.mode == 'deploy'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=ja family | head -3

      - name: 画像を作る
        if: steps.mode.outputs.mode == 'deploy'
        working-directory: line-richmenu
        run: npm run build

      - name: 作った画像を残す
        if: steps.mode.outputs.mode == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: richmenu-images
          path: line-richmenu/out/*.png

      - name: LINEに反映する
        if: steps.mode.outputs.mode == 'deploy'
        working-directory: line-richmenu
        run: npm run deploy

      - name: ユーザーにリンクする
        if: steps.mode.outputs.mode == 'link'
        working-directory: line-richmenu
        run: npm run link -- ${{ steps.mode.outputs.args }}

      - name: 全部消す
        if: steps.mode.outputs.mode == 'clear'
        working-directory: line-richmenu
        run: npm run clear -- --yes

      - name: いまの登録内容を出す
        working-directory: line-richmenu
        run: npm run inspect
