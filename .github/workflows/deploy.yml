name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/sake-tasting-app-demo-bbnia0
      - claude/kanji-learning-app-jqnn9u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kanji/package-lock.json
      # きき酒ノート（サイトのルート）
      - run: npm ci
      - run: npm run build
      # かんじドリル（/kanji/ 配下）
      - run: npm ci --prefix kanji
      - run: npm run build --prefix kanji
      - run: |
          mkdir -p dist/kanji
          cp -r kanji/dist/. dist/kanji/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
